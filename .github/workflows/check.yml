name: Check Dutch GP Tickets

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright & Requests
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Ticket Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > check.py
          import os
          import json
          import requests
          from playwright.sync_api import sync_playwright

          SHOP_URL = "https://shop.ticketing.cm.com/dgpresell/resell/subscription/01612d62-d8f4-4f04-a706-44c5ec27fc96"
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          keywords = [
              "general admission", "staanplaats", "staanplaatsen",
              "ga 1", "ga 2", "grandstand", "vrijdag", "friday",
              "tribune", "tarzan", "arena", "eastside", "pit"
          ]

          print(f"🚀 Launching headless browser to inspect: {SHOP_URL}")

          captured_apis = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
              )
              page = context.new_page()

              # Intercept all internal XHR/Fetch API calls the shop makes
              def on_response(response):
                  req = response.request
                  if req.resource_type in ["xhr", "fetch"]:
                      try:
                          text = response.text()
                          print(f"\n📡 [NETWORK XHR] {response.status} {response.url}")
                          print(f"Payload Preview: {text[:350]}")
                          captured_apis.append((response.url, text))
                      except Exception:
                          pass

              page.on("response", on_response)

              try:
                  page.goto(SHOP_URL, wait_until="networkidle", timeout=30000)
              except Exception as e:
                  print(f"Page load notice: {e}")

              # Brief pause for dynamic Angular rendering
              page.wait_for_timeout(3000)

              # 1. Inspect rendered DOM text
              page_text = page.inner_text("body").lower()
              print(f"\n📄 RENDERED PAGE PREVIEW:\n{page_text[:400]}\n")

              matched_in_page = [kw for kw in keywords if kw in page_text]

              # 2. Inspect captured API payloads
              matched_in_api = []
              for url, payload in captured_apis:
                  p_lower = payload.lower()
                  # Exclude static venue layout endpoints
                  if "seatedapi" not in url:
                      for kw in keywords:
                          if kw in p_lower and kw not in matched_in_api:
                              matched_in_api.append(kw)

              matches = list(set(matched_in_page + matched_in_api))
              print(f"🔎 Keyword matches found: {matches}")

              # Verify against purchase / ticket indicators
              has_ticket_indicators = any(ind in page_text for ind in ["ticket", "kaart", "€", "available", "beschikbaar", "bestel", "selecteer"])

              if matches and has_ticket_indicators:
                  print(f"⚡ TICKETS DETECTED! Alerting Telegram for: {matches}")
                  msg = (
                      f"🏎️ 🎟️ <b>DUTCH GP RESALE TICKETS AVAILABLE!</b>\n\n"
                      f"<b>Matched Categories:</b> {', '.join(matches)}\n\n"
                      f"<b>Buy Now:</b> {SHOP_URL}"
                  )
                  if token and chat_id:
                      res = requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          json={"chat_id": chat_id, "text": msg, "parse_mode": "HTML"}
                      )
                      print(f"Telegram response: {res.status_code}")
              else:
                  print("✅ Check complete: No active resale inventory currently matching.")

              browser.close()
          EOF

          python check.py
