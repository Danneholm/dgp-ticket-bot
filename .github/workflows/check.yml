name: Check Dutch GP Tickets

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Requests
        run: pip install requests

      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests, json

          SUB_ID = '01612d62-d8f4-4f04-a706-44c5ec27fc96'
          VENUE_ID = '12c424fe-b4e6-48e3-a710-5c1785eea8f5'
          SHOP_URL = f'https://shop.ticketing.cm.com/dgpresell/resell/subscription/{SUB_ID}'

          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Origin': 'https://shop.ticketing.cm.com',
              'Referer': SHOP_URL
          }

          endpoints_to_probe = [
              f'https://api.ticketing.cm.com/resell/v1.0/subscription/{SUB_ID}/offers',
              f'https://api.ticketing.cm.com/resell/v1.0/subscription/{SUB_ID}',
              f'https://api.ticketing.cm.com/resell/v1.0/subscription/{SUB_ID}/items',
              f'https://api.ticketing.cm.com/resell/v1.0/subscription/{SUB_ID}/availability',
              f'https://api.ticketing.cm.com/resell/v1.0/public/subscription/{SUB_ID}/offers',
              f'https://api.ticketing.cm.com/resell/v1.0/offers?subscriptionId={SUB_ID}',
              f'https://api.ticketing.cm.com/resellapi/v1.0/subscription/{SUB_ID}/offers',
              f'https://api.ticketing.cm.com/resellapi/v1.0/public/subscription/{SUB_ID}',
              f'https://api.ticketing.cm.com/seatedapi/v1.0/public/venue/{VENUE_ID}/resell/subscription/{SUB_ID}',
              f'https://api.ticketing.cm.com/seatedapi/v1.0/public/venue/{VENUE_ID}/resell/subscription/{SUB_ID}/availability',
              f'https://api.ticketing.cm.com/seatedapi/v1.0/public/venue/{VENUE_ID}/event/subscription/{SUB_ID}/availability',
              f'https://shop.ticketing.cm.com/api/resell/subscription/{SUB_ID}'
          ]

          keywords = ['general admission', 'staanplaats', 'staanplaatsen', 'ga 1', 'ga 2', 'grandstand', 'vrijdag', 'friday', 'tribune', 'tarzan', 'arena', 'eastside', 'pit']

          found_working_api = False

          for url in endpoints_to_probe:
              try:
                  res = requests.get(url, headers=headers, timeout=5)
                  print(f'Testing: {url} --> Status: {res.status_code}')
                  
                  if res.status_code == 200:
                      found_working_api = True
                      print(f'\n🎯 SUCCESSFUL ENDPOINT FOUND:\n{url}\n')
                      try:
                          data = res.json()
                          print('RESPONSE DATA SAMPLE:')
                          print(json.dumps(data, indent=2)[:1500])
                          
                          # Search response for ticket matches
                          data_str = json.dumps(data).lower()
                          matched_kws = [kw for kw in keywords if kw in data_str]
                          
                          if matched_kws:
                              print(f'\n⚡ MATCH FOUND FOR KEYWORDS: {matched_kws}')
                              msg = f'🏎️ 🎟️ <b>DUTCH GP TICKETS DETECTED!</b>\n\n<b>Keywords matched:</b> {matched_kws}\n\n<b>Buy Now:</b> {SHOP_URL}'
                              requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'})
                              print('Telegram alert sent successfully!')
                      except Exception as parse_err:
                          print(f'Could not parse JSON: {parse_err}')
                      break
              except Exception as e:
                  print(f'Failed connecting to {url}: {e}')

          if not found_working_api:
              print('\nNone of the direct endpoints returned 200 OK.')
          "
